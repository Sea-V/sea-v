[build]
  publish = "."
  command = "echo 'Static site — no build step'"

[[redirects]]
  from = "/u/:username"
  to = "/public-profile.html?u=:username"
  status = 200

# Development-only files are never served (2026-09-26 audit; mirrors
# .vercelignore). Netlify publishes "." so it cannot exclude them at build.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CHAT-HANDOFF-2026-08-16.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.cursor/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/eslint.config.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/u/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP (v590): every CDN source is an exact, pinned library path (also
    # SRI-hashed in the HTML). 'unsafe-eval' stays ONLY for heic2any, whose
    # emscripten build calls new Function(); 'unsafe-inline' stays until the
    # inline <script> blocks move to files. Keep in sync with vercel.json.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/ https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/ https://cdn.jsdelivr.net/npm/heic2any@0.0.4/ https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/ https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/ https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/ https://unpkg.com/leaflet@1.9.4/ https://js-de.sentry-cdn.com https://browser.sentry-cdn.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://unpkg.com/leaflet@1.9.4/; img-src 'self' data: blob: https://*.supabase.co https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/ https://*.ingest.de.sentry.io https://*.sentry.io; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Multi-page app — serve HTML files directly (no SPA fallback needed)
