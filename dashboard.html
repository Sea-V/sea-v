<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sentry error monitoring — loaded first so it can catch errors from anything below.
       window.sentryOnLoad runs once the loader's bundle is ready and lets us
       apply extra Sentry.init() options on top of the dashboard defaults.
       SEA-V's API traffic carries maritime crew PII (payslips, certificates,
       references, DOB, addresses) — don't let Sentry attach reporter IP/user
       info or capture request/response bodies to error events. See:
       https://docs.sentry.io/platforms/javascript/configuration/options/#dataCollection -->
  <script>
    window.sentryOnLoad = function () {
      Sentry.init({
        dataCollection: {
          userInfo: false,
          httpBodies: []
        }
      });
    };
  </script>
  <script
    src="https://js-de.sentry-cdn.com/daebc8b90d74e12665f57000fe529d6a.min.js"
    crossorigin="anonymous"
  ></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico?v=601" sizes="any" />

<body class="app-page" data-topbar="app" data-sidebar="app" data-shared-modals="true">

  <!--
    Static, JS-independent loading overlay — visible on first paint (no
    JS execution required), so slow auth/data loads never show a blank
    page. js/feedback.js's ensurePageLoader() reuses this element instead
    of creating a duplicate; js/state.js hides it once data is ready.
  -->
  <div id="appPageLoader" class="seav-page-loader is-visible" role="status" aria-live="polite">
    <div class="seav-page-loader-card">
      <div class="seav-page-loader-mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 18c1.2-.9 2.4-.9 3.6 0 1.2.9 2.4.9 3.6 0 1.2-.9 2.4-.9 3.6 0 1.2.9 2.4.9 3.6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M8 14.5h8l-1.4-3.5H9.4L8 14.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="seav-page-loader-text">Setting sail…</p>
      <p class="seav-page-loader-sub">Loading your career records</p>
      <div class="seav-loader-ocean" aria-hidden="true">
        <svg class="seav-wave-a" viewBox="0 0 720 48" preserveAspectRatio="none">
          <path d="M0 24 C120 8 240 32 360 16 C480 0 600 24 720 12 V48 H0 Z" fill="rgba(91,188,255,0.35)"/>
        </svg>
        <svg class="seav-wave-b" viewBox="0 0 720 48" preserveAspectRatio="none">
          <path d="M0 24 C120 8 240 32 360 16 C480 0 600 24 720 12 V48 H0 Z" fill="rgba(114,228,255,0.55)"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Topbar -->
  <div id="topbarMount"></div>

  <main class="dash">

    <!-- Sidebar -->
    <div id="sidebarMount"></div>

    <!-- Main Content -->
    <section class="dash-content">

      <article class="home-shell dashboard-shell-card" id="homeShell">

        <!-- v601: home is the one next step, the CV and only the numbers the crew
             member holds (js/dashboard-home.js). What it says comes from
             js/seav-home-logic.js. -->
        <div class="dashboard-shell-head" id="homeHead">
            <div class="dashboard-shell-copy home-head">
              <h2 id="homeTitle">Home</h2>
              <p id="homeSub"></p>
              <div class="home-meter" id="homeMeter" hidden><i></i></div>
            </div>
        </div>

        <section class="dashboard-shell-section home-cols" id="homeMain">
            <div class="home-stack">
              <div class="home-box home-next" id="homeNext"></div>
              <a class="home-yacht" href="vessels.html" id="homeYacht" hidden></a>
              <div class="home-tiles" id="homeTiles" hidden></div>
              <div class="home-box" id="homeChecklist" hidden></div>
            </div>
            <aside class="home-cv-wrap" aria-label="Your CV">
              <div id="homeCv"></div>
              <div class="home-cv-actions">
                <a class="btn-blue" href="cv-generator.html" id="homeCvOpen">Open my CV</a>
                <button type="button" class="btn-ghost2" id="homeCvShare">Share</button>
              </div>
            </aside>
        </section>

        <!-- First-run setup, for an account with nothing in it. The heads stay
             direct children of the shell: the theme's title rules need that. -->
        <div class="dashboard-shell-head" id="setupHead" hidden>
          <div class="dashboard-shell-copy home-head" id="homeShellHeadTitle"></div>
        </div>
        <section class="dashboard-shell-section home-cols" id="homeSetup" hidden>
          <div class="home-box" id="setupBody"></div>
          <aside class="home-cv-wrap" aria-label="Your CV"><div id="setupCv"></div></aside>
        </section>

      </article>

</section>

  <footer class="page-quote-footer">
    <p class="page-quote-footer-text">&ldquo;The standard you walk past is the standard you accept.&rdquo;</p>
  </footer>

</main>

  <!-- Shared Modals -->
  <div id="sharedModalsMount"></div>

  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
